# MIFS on personal: uses the existing cgn.fi wildcard certificate, like notka.
# Install the rendered file in sites-available/mifs and symlink sites-enabled/mifs.
# These directives belong inside nginx's http context (Debian sites-enabled).
map $request_method $mifs_write_key {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $mifs_write_key zone=mifs_writes:10m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name mifs.cgn.fi;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://mifs.cgn.fi$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mifs.cgn.fi;
    ssl_certificate /home/acme/live/cgn/cert.pem;
    ssl_certificate_key /home/acme/live/cgn/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 16k;
    limit_req_status 429;
    access_log /var/log/nginx/mifs.access.log;
    error_log /var/log/nginx/mifs.error.log;

    location / {
        limit_req zone=mifs_writes burst=10 nodelay;
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 90s;
    }
}
